/* Pull-to-refresh */
.refresh-indicator{position:fixed;z-index:50;top:0;left:50%;transform:translate(-50%,-72px);display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:0 0 24px 24px;background:#fff;color:var(--navy);box-shadow:0 5px 20px #10202d18;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .16s ease;will-change:transform}
.refresh-indicator.visible{opacity:1}
.refresh-spinner{width:17px;height:17px;border:2px solid #dce9e7;border-top-color:var(--teal);border-radius:50%;display:inline-block}
.refresh-indicator.loading .refresh-spinner{animation:gomogie-spin .7s linear infinite}
@keyframes gomogie-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.refresh-spinner{animation:none!important}.refresh-indicator{transition:none}}
body.pull-dragging .top,body.pull-dragging .layout{transform:translate3d(0,var(--pull-offset,0px),0);transition:none;will-change:transform}
body.pull-releasing .top,body.pull-releasing .layout{transform:translate3d(0,0,0);transition:transform .62s cubic-bezier(.22,1.35,.36,1);will-change:transform}
@media(prefers-reduced-motion:reduce){body.pull-releasing .top,body.pull-releasing .layout{transition:transform .18s ease}}

<div class="connection-notice" id="connectionNotice" role="status" aria-live="polite">You are offline. Showing your last loaded feed.</div><div class="preview-notice" role="note">GomoGie preview · Sample profiles and activity</div><header class="top"><img class="logo" src="assets/brand/GomoGie-wordmark-transparent.svg" alt="GomoGie"><input class="search" id="search" placeholder="Search GomoGie"><div class="topright"><button class="soft" id="authButton">Log in</button><button class="soft hide-mobile" id="notify">♧ Notifications</button><img class="avatar" id="topAvatar" alt="Profile photo"></div></header>

<script>
const labels={home:["⌂","Home"],pulse:["⌁","Pulse"],watch:["▷","Watch"],communities:["♧","Communities"],connect:["✉","Connect"],studio:["▤","Studio"],profile:["◉","Profile"]};
let accounts=[],posts=[],active="home",watchMode="for-you",liked=new Set(),followed=new Set(),selectedProfileId=null,profileTab="posts",editingProfile=false,profileDraft={},savedPosts=new Set(),localPendingPosts=[];
const view=document.getElementById("view");
const API_BASE="https://gomogie-api.terajuciptabina.workers.dev";
let currentUser=null;
const TOKEN_KEY="gomogie-access-token";
function getToken(){try{return sessionStorage.getItem(TOKEN_KEY)||""}catch{return ""}}
async function apiRequest(path,options={}){const headers={accept:"application/json",...(options.headers||{})};if(getToken())headers.authorization="Bearer "+getToken();if(options.body)headers["content-type"]="application/json";const response=await fetch(API_BASE+path,{...options,headers,cache:"no-store"});if(response.status===401){signOut(false);throw new Error("Your session has expired. Please log in again.")}const payload=response.status===204?null:await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload?.message||payload?.error||"Request failed ("+response.status+")");return payload}
function setAuthError(message){const node=document.getElementById("authError");if(node)node.textContent=message||""}
let authMode="login";
function setAuthMode(mode){authMode=mode;const registering=mode==="register";document.getElementById("authTitle").textContent=registering?"Create your account":"Welcome back";document.getElementById("authIntro").textContent=registering?"Join the GomoGie community.":"Log in to your GomoGie account.";document.getElementById("loginFields").hidden=registering;document.getElementById("registerFields").hidden=!registering;document.querySelectorAll("#loginFields input").forEach(x=>x.required=!registering);document.querySelectorAll("#registerFields input").forEach(x=>x.required=registering);document.getElementById("loginSubmit").textContent=registering?"Create account":"Log in";document.getElementById("authSwitchText").innerHTML=registering?'Already have an account? <button type="button" id="showLogin" class="auth-switch">Log in</button>':'New to GomoGie? <button type="button" id="showRegister" class="auth-switch">Create account</button>';const toggle=document.getElementById(registering?"showLogin":"showRegister");if(toggle)toggle.onclick=()=>{setAuthMode(registering?"login":"register");setAuthError("")};setAuthError("")}
function openAuth(mode="login"){const layer=document.getElementById("authLayer");if(layer){layer.hidden=false;setAuthMode(mode)}}
function closeAuth(){const layer=document.getElementById("authLayer");if(layer)layer.hidden=true}

const refreshIndicator=document.getElementById("refreshIndicator"),refreshLabel=document.getElementById("refreshLabel");
let refreshStartY=0,pullDistance=0,pullArmed=false,isRefreshing=false,releaseTimer=null;
function setPullOffset(px){document.body.style.setProperty("--pull-offset",px+"px")}
function paintPull(distance){
 const rubber=distance<=120?distance*.58:69.6+(distance-120)*.22;
 const shown=Math.min(rubber,105);
 setPullOffset(shown);
 refreshIndicator.style.transform="translate(-50%,"+Math.max(-72,shown-72)+"px)";
 refreshIndicator.classList.toggle("visible",distance>7);
 refreshLabel.textContent=distance>=88?"Release to refresh":"Pull to refresh";
}
function springBack(){
 document.body.classList.remove("pull-dragging");
 document.body.classList.add("pull-releasing");
 setPullOffset(0);
 refreshIndicator.classList.remove("visible");
 refreshIndicator.style.transform="translate(-50%,-72px)";
 clearTimeout(releaseTimer);
 releaseTimer=setTimeout(()=>document.body.classList.remove("pull-releasing"),680);
}
const DB_NAME="gomogie-device-cache",DB_VERSION=1;
function openLocalDB(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains("cache"))request.result.createObjectStore("cache")};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function localGet(key){const db=await openLocalDB();return new Promise((resolve,reject)=>{const tx=db.transaction("cache","readonly"),r=tx.objectStore("cache").get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function localSet(key,value){const db=await openLocalDB();return new Promise((resolve,reject)=>{const tx=db.transaction("cache","readwrite");tx.objectStore("cache").put(value,key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}

async function loadGomoGieData(){

 const notice=document.querySelector(".preview-notice");
 try{
  const liveItems=await fetchPublicApiFeed();
  accounts=liveItems.map(item=>item.author).filter(Boolean).map(author=>({id:author.id,handle:author.username,displayName:author.displayName||author.username,avatarUrl:author.avatarUrl||"",coverUrl:"",bio:"",location:"",website:"",joined:"GomoGie",followers:0,following:0}));

  try{await localSet("last-live-feed",{accounts,posts,savedAt:Date.now()})}catch(cacheError){console.warn("Live feed cache unavailable:",cacheError)}
 }catch(error){
  console.error("Live GomoGie feed failed:",error);
  let cached=null;try{cached=await localGet("last-live-feed")}catch(cacheError){console.warn("Live feed cache unavailable:",cacheError)}
  if(cached&&Array.isArray(cached.accounts)&&Array.isArray(cached.posts)){accounts=cached.accounts;posts=cached.posts;if(notice)notice.textContent="GomoGie · Showing previously loaded live posts (offline)"}
  else if(notice)notice.textContent="GomoGie · Live service temporarily unavailable";
 }
 await restoreSession();

 const me=currentUser&&accounts.find(a=>a.id===currentUser.id);if(me&&currentUser){Object.assign(me,{handle:currentUser.username,displayName:currentUser.displayName||currentUser.username,avatarUrl:currentUser.avatarUrl||me.avatarUrl,bio:currentUser.bio||"",location:currentUser.location||"",website:currentUser.website||"",coverUrl:currentUser.coverUrl||me.coverUrl})}
 extras();render();updateConnectionState();
}
async function refreshGomoGie(){
 if(isRefreshing)return;
 isRefreshing=true;pullArmed=false;pullDistance=0;
 document.body.classList.remove("pull-dragging","pull-releasing");
 setPullOffset(0);
 refreshIndicator.classList.add("visible","loading");
 refreshLabel.textContent="Refreshing GomoGie…";
 refreshIndicator.style.transform="translate(-50%,0px)";
 try{
  await loadGomoGieData();
  refreshLabel.textContent="GomoGie updated";
 }catch(error){
  refreshLabel.textContent="Refresh failed. Pull down to try again.";
  console.error("GomoGie refresh failed:",error);
 }finally{
  refreshIndicator.classList.remove("loading");
  setTimeout(()=>{refreshIndicator.classList.remove("visible");refreshIndicator.style.transform="translate(-50%,-72px)";isRefreshing=false},900);
 }
}
document.addEventListener("touchstart",e=>{
 if(isRefreshing||window.scrollY>0||!e.touches||e.touches.length!==1)return;
 if(e.target.closest("input,textarea,select,[contenteditable=true]"))return;
 refreshStartY=e.touches[0].clientY;pullDistance=0;pullArmed=true;
 document.body.classList.remove("pull-releasing");
 document.body.classList.add("pull-dragging");
},{passive:true});
document.addEventListener("touchmove",e=>{
 if(!pullArmed||isRefreshing||!e.touches||e.touches.length!==1)return;
 const delta=e.touches[0].clientY-refreshStartY;
 if(delta<=0){pullDistance=0;setPullOffset(0);refreshIndicator.classList.remove("visible");return}
 if(window.scrollY<=0){
  pullDistance=delta;
  if(delta>4)e.preventDefault();
  paintPull(delta);
 }
},{passive:false});
document.addEventListener("touchend",()=>{
 if(!pullArmed)return;
 const shouldRefresh=pullDistance>=88;

 if(shouldRefresh)refreshGomoGie();
 else springBack();
},{passive:true});
document.addEventListener("touchcancel",()=>{if(!pullArmed)return;pullArmed=false;pullDistance=0;springBack()},{passive:true});
