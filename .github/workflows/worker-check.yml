name: Cloudflare Worker checks

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply the legacy SQL migration batch (only when explicitly required)"
        required: false
        default: false
        type: boolean

  pull_request:
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-check.yml"

concurrency:
  group: gomogie-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run

      - name: Apply additive video and poll D1 migration
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0003_video_polls.sql

      - name: Apply additive Viral News D1 migration
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0004_viral_news.sql




      - name: Add The Sun Malaysia news source
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0007_viral_news_sources.sql


      - name: Backfill verified BERNAMA article photo
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0008_bernama_photo_backfill.sql


      - name: Add Bahasa Melayu news source and verified BERNAMA image
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0009_malay_news_and_bernama_image.sql

      - name: Add global and trending content sources
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0011_global_trending_sources.sql

      - name: Add reliable publisher feeds and pause blocked sources
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0012_reliable_publisher_feeds.sql

      - name: Apply Communities D1 migration
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0013_communities.sql

      - name: Deploy Worker to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api

      - name: Diagnose live D1 feed query without modifying data
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx wrangler d1 execute gomogie-db --remote --command="SELECT p.id,p.user_id,p.content,p.visibility,p.created_at,p.comments_enabled,u.username,pr.display_name,pr.avatar_url,pr.cover_url,(SELECT COUNT(*) FROM reactions r WHERE r.post_id=p.id) AS reaction_count,(SELECT COUNT(*) FROM comments c WHERE c.post_id=p.id AND c.status='published') AS comment_count,ma.id AS media_id,va.id AS video_id,gp.id AS poll_id,gp.closes_at AS poll_closes_at FROM posts p JOIN users u ON u.id=p.user_id LEFT JOIN profiles pr ON pr.user_id=p.user_id LEFT JOIN gomogie_post_media pm ON pm.post_id=p.id LEFT JOIN gomogie_media_assets ma ON ma.id=pm.media_id AND ma.status='ready' LEFT JOIN gomogie_post_videos pv ON pv.post_id=p.id LEFT JOIN gomogie_video_assets va ON va.id=pv.video_id AND va.status='ready' LEFT JOIN gomogie_polls gp ON gp.post_id=p.id WHERE p.status='published' AND p.visibility='public' LIMIT 1"

      - name: Smoke-test deployed Worker and storage dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          response="$(curl --silent --show-error --fail --retry 5 --retry-delay 3 --retry-all-errors https://gomogie-api.terajuciptabina.workers.dev/v1/health)"
          echo "$response" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(raw);
              console.log("Worker health:", JSON.stringify(health));
              if (health.checks?.database !== "available") process.exit(1);
              if (health.checks?.mediaStorage !== "available") {
                console.log("::warning::R2 media storage is degraded; Worker and D1 are responding.");
              }
            });
          '
          feed="$(curl --silent --show-error --fail --retry 3 --retry-delay 2 https://gomogie-api.terajuciptabina.workers.dev/v1/feed?limit=1)"
          news="$(curl --silent --show-error --fail --retry 3 --retry-delay 2 'https://gomogie-api.terajuciptabina.workers.dev/v1/news?mode=for-you&limit=1')"
          FEED_JSON="$feed" NEWS_JSON="$news" node -e '
            const feed = JSON.parse(process.env.FEED_JSON);
            const news = JSON.parse(process.env.NEWS_JSON);
            if (!Array.isArray(feed.items)) throw new Error("Public feed response is invalid");
            if (!Array.isArray(news.items)) throw new Error("Pulse news response is invalid");
            console.log("Public feed items:", feed.items.length);
            console.log("Pulse news items:", news.items.length);
            if (!news.items.length) console.log("::warning::Pulse API is responding, but currently has no published news items.");
          '

      - name: Report missing Cloudflare deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::Worker checks passed, but live deployment was skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository Actions secrets to enable automatic deployment."

      - name: Verify frontend and media delivery use the same Worker origin
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          frontend = Path('../../index.html').read_text()
          worker = Path('src/index.js').read_text()
          frontend_match = re.search(r'const API_BASE="(https://[^"]+)"', frontend)
          media_match = re.search(r'function mediaUrl\(id\) \{ return "(https://[^"]+)/v1/media/', worker)
          assert frontend_match, 'Frontend API_BASE not found'
          assert media_match, 'Worker media URL origin not found'
          assert frontend_match.group(1) == media_match.group(1), (
              f'Frontend API origin {frontend_match.group(1)} differs from media origin {media_match.group(1)}'
          )
          assert 'if (path === "/v1/health" && method === "GET")' in worker, 'Production health endpoint missing'
          assert 'const followingFeedRequest = path === "/v1/feed" && url.searchParams.get("scope") === "following"' in worker, 'Authenticated Following feed route missing'
          assert "p.visibility IN ('public','followers')" in worker, 'Following feed visibility filter missing'
          assert 'if (path === "/v1/users/me/following" && method === "GET")' in worker, 'Following relationship restore route missing'
          assert 'async function fetchFollowingApiFeed()' in frontend, 'Frontend Following feed API client missing'
          assert 'apiRequest("/v1/users/me/following")' in frontend, 'Frontend does not restore followed accounts after login'
          assert 'parent_comment_not_found' in worker, 'Nested reply parent ownership check missing'
          assert 'WHERE id=? AND post_id=? AND status=\'published\'' in worker, 'Nested reply must be scoped to the same post'
          assert 'const recipients = new Set([owner?.user_id, parent?.user_id]' in worker, 'Nested reply notifications missing'
          print('Verified Worker origin, authenticated Following feed, visibility filter and follow-state restoration.')
          PY
