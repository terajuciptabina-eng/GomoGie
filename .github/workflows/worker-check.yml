name: Cloudflare Worker checks

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

  pull_request:
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-check.yml"

concurrency:
  group: gomogie-worker-paid-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run

      - name: Deploy Worker to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api

      - name: Smoke-test deployed Worker and storage dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          response="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors https://gomogie-api.terajuciptabina.workers.dev/v1/health)"
          echo "$response" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(raw);
              console.log("Worker health:", JSON.stringify(health));
              if (health.checks?.database !== "available") process.exit(1);
              if (health.checks?.databaseReads !== "available") {
                console.log("::warning::D1 is reachable but row-reading queries are unavailable; check daily quota.");
              }
              if (health.checks?.mediaStorage !== "available") {
                console.log("::warning::R2 media storage is degraded; Worker and D1 are responding.");
              }
            });
          '
          feed_status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 2 -o /tmp/gomogie-feed.json -w '%{http_code}' 'https://gomogie-api.terajuciptabina.workers.dev/v1/feed?limit=1')"
          news_status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 2 -o /tmp/gomogie-news.json -w '%{http_code}' 'https://gomogie-api.terajuciptabina.workers.dev/v1/news?mode=for-you&limit=1')"
          developer_status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 2 -o /tmp/gomogie-developer.json -w '%{http_code}' 'https://gomogie-api.terajuciptabina.workers.dev/v1/developer/me')"
          if [ "$developer_status" != "401" ]; then
            echo "::error::Unauthenticated Developer API must return HTTP 401, received $developer_status."
            cat /tmp/gomogie-developer.json
            exit 1
          fi
          if [ "$feed_status" = "200" ]; then
            FEED_JSON="$(cat /tmp/gomogie-feed.json)" node -e 'const x=JSON.parse(process.env.FEED_JSON);if(!Array.isArray(x.items))process.exit(1);console.log("Public feed items:",x.items.length)'
          else
            echo "::warning::Public feed returned HTTP $feed_status; inspect D1 daily quota and Worker logs."
            cat /tmp/gomogie-feed.json
          fi
          if [ "$news_status" = "200" ]; then
            NEWS_JSON="$(cat /tmp/gomogie-news.json)" node -e 'const x=JSON.parse(process.env.NEWS_JSON);if(!Array.isArray(x.items))process.exit(1);console.log("Pulse news items:",x.items.length);if(!x.items.length)console.log("::warning::Pulse currently has no published news items.")'
          else
            echo "::warning::Pulse API returned HTTP $news_status; inspect D1 daily quota and Worker logs."
            cat /tmp/gomogie-news.json
          fi

      - name: Report missing Cloudflare deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::Worker checks passed, but live deployment was skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository Actions secrets to enable automatic deployment."

      - name: Verify frontend and media delivery use the same Worker origin
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          frontend = Path('../../index.html').read_text()
          worker = Path('src/index.js').read_text()
          frontend_match = re.search(r'const API_BASE="(https://[^"]+)"', frontend)
          media_match = re.search(r'function mediaUrl\(id\) \{ return "(https://[^"]+)/v1/media/', worker)
          assert frontend_match, 'Frontend API_BASE not found'
          assert media_match, 'Worker media URL origin not found'
          assert frontend_match.group(1) == media_match.group(1), (
              f'Frontend API origin {frontend_match.group(1)} differs from media origin {media_match.group(1)}'
          )
          assert 'if (path === "/v1/health" && method === "GET")' in worker, 'Production health endpoint missing'
          assert 'const followingFeedRequest = path === "/v1/feed" && url.searchParams.get("scope") === "following"' in worker, 'Authenticated Following feed route missing'
          assert "p.visibility IN ('public','followers')" in worker, 'Following feed visibility filter missing'
          assert 'if (path === "/v1/users/me/following" && method === "GET")' in worker, 'Following relationship restore route missing'
          assert 'async function fetchFollowingApiFeed()' in frontend, 'Frontend Following feed API client missing'
          assert 'apiRequest("/v1/users/me/following")' in frontend, 'Frontend does not restore followed accounts after login'
          assert 'parent_comment_not_found' in worker, 'Nested reply parent ownership check missing'
          assert 'WHERE id=? AND post_id=? AND status=\'published\'' in worker, 'Nested reply must be scoped to the same post'
          assert 'const recipients = new Set([owner?.user_id, parent?.user_id]' in worker, 'Nested reply notifications missing'
          assert 'relationshipMatch = path.match' in worker and 'relationships|followers|following|friends' in worker, 'Member profile friends route missing'
          assert 'friends: Number(friends?.count || 0)' in worker, 'Member profile friends count missing'
          assert 'data-relationship-list="friends"' in frontend, 'Profile friends list entry missing'
          assert 'data-relationship-list="friends"' in frontend and 'profileFriendCount' in frontend, 'Profile friends count UI missing'
          assert 'profileFriendButton.dataset.relationshipState="friends"' in frontend, 'Profile friend-state UI missing'
          assert 'isPendingRequest?"message_request":"message"' in worker, 'New direct-message in-app notification missing'
          assert 'message:{title:"New message from "+name' in worker and 'message_request:{title:"Message request from "+name' in worker, 'Direct-message push notifications missing'
          assert 'message_request_accepted' in worker, 'Message-request acceptance notification missing'
          assert 'if(type==="message_request")' in frontend and 'if(type==="message")' in frontend, 'Frontend message notification labels missing'
          assert 'https://api.openverse.org/v1/audio/' in frontend, 'Openverse audio search integration missing'
          assert 'license:"by,by-sa,cc0,pdm"' in frontend, 'Openverse search must restrict results to commercially usable licences'
          assert 'searchOpenverseMusic(clean,genre,append)' in frontend, 'Openverse results are not merged into music catalogue'
          assert 'musicOpenverseHasMore' in frontend, 'Openverse pagination state missing'
          assert 'mp3d.jamendo.com' in worker and 'cdn.freesound.org' in worker, 'Openverse audio host allow-list missing'
          assert 'else if(/^CC BY(?:\\s|$)/.test(rawLicense))' in worker, 'Strict CC BY licence validation missing'
          assert 'CC BY-NC' not in worker, 'Non-commercial licence must not be accepted'
          assert 'path.startsWith("/v1/developer/")' in worker, 'Developer API must require authentication'
          assert 'if (!admin) return json({ error:"developer_access_required" },403)' in worker, 'Developer API must deny authenticated non-admin accounts'
          assert 'if (admin.role !== "super_admin") return json({error:"insufficient_permissions"},403)' in worker, 'Administrator management must be Owner-only'
          assert 'if (!["super_admin","admin","analyst"].includes(admin.role))' in worker, 'Audit logs must enforce role permissions'
          assert 'const recentActivity=["super_admin","admin","analyst"].includes(admin.role)' in worker, 'Developer overview must not leak audit activity to restricted roles'
          assert 'currentUser&&developerAccess&&developerAccessUserId===currentUser.id' in frontend, 'Developer navigation must be hidden from non-developer accounts'
          assert 'developerCapabilities.includes("logs")' in frontend, 'Frontend must respect audit-log role capability'
          assert 'developer-admin-form' in frontend and 'developer-admin-actions' in frontend, 'Responsive administrator management UI missing'
          assert 'developerAccessUserId!==currentUser.id' in frontend, 'Developer page must validate the active account identity'
          print('Verified Worker origin, social permissions, developer API authentication, role permissions and responsive administrator console.')

          PY
