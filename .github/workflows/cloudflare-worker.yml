name: Validate and deploy GomoGie Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and VAPID generator syntax
        run: |
          node --check workers/api/src/index.js
          node --check workers/api/scripts/generate-vapid.mjs
          node --check workers/api/scripts/configure-vapid.mjs
      - name: Validate push implementation and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          worker = Path("workers/api/src/index.js").read_text()
          helper = Path("workers/api/scripts/generate-vapid.mjs").read_text()
          config = Path("workers/api/wrangler.toml").read_text()
          migrations = list(Path("workers/api").rglob("*.sql"))
          push_migrations = [p for p in migrations if "push" in p.name.lower() or "push" in p.read_text().lower()]
          assert "async function sendWebPush" in worker
          assert "async function notifyPushDevices" in worker
          assert "VAPID_PUBLIC_KEY" in worker and "VAPID_PRIVATE_JWK" in worker and "VAPID_SUBJECT" in worker
          assert 'path==="/v1/push/public-key"' in worker
          assert 'path==="/v1/push/subscribe"' in worker
          assert "mailto:terajuciptabina@gmail.com" in helper
          assert "database_name = \"gomogie-db\"" in config
          assert push_migrations, "No D1 migration defining the web-push subscription table was found."
          assert "gomogie_push_subscriptions" in "\n".join(p.read_text() for p in push_migrations)
          print("Validated Worker push sender, VAPID generator, D1 migration and deployment configuration.")
          PY
      - name: Validate friend and message request implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path('workers/api/src/index.js').read_text()
          migration = Path('workers/api/sql/0019_relationships_and_message_requests.sql').read_text()
          page = Path('index.html').read_text()
          for route in ['/v1/friends','/v1/friend-requests','/v1/message-requests','/friend-request']:
              assert route in worker, f'Missing relationship route: {route}'
          assert 'gomogie_message_requests' in worker and 'friend_requests' in worker
          assert 'CREATE TABLE IF NOT EXISTS friend_requests' in migration
          assert 'CREATE TABLE IF NOT EXISTS gomogie_message_requests' in migration
          assert 'data-connect-tab="friends"' in page and 'data-connect-tab="requests"' in page and 'data-connect-tab="messages"' in page
          assert 'settings-feature-detail' not in page and 'settings-feature-summary' not in page
          print('Validated friendship, follow separation, message requests and Connect UI.')
          PY
      - name: Validate Pages notification-click scope fix
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("sw.js").read_text()
          assert 'new URL(event.notification.data?.url||"./",self.registration.scope).href' in worker
          print("Validated notification navigation remains inside the GomoGie Pages scope.")
          PY

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository/environment secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret."; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Apply only the additive Web Push schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0018_web_push.sql
      - name: Apply additive relationship and message request schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0019_relationships_and_message_requests.sql
      - name: Apply ordered mixed-media post gallery schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0020_post_media_gallery.sql
      - name: Apply private message attachments schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0021_message_attachments.sql
      - name: Add message image context to media assets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0022_message_image_context.sql
      - name: Deploy Worker before checking existing Push keys
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
      - name: Generate VAPID keys once and configure Worker secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/configure-vapid.mjs
      - name: Deploy Worker with Push configuration
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
