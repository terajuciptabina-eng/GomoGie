name: Deploy GomoGie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate prototype entry point
        run: test -s index.html && test -s assets/brand/GomoGie-wordmark-transparent.svg
      - name: Validate frontend JavaScript and API integration
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, f'Expected one inline application script, found {len(scripts)}'
          Path('/tmp/gomogie-inline.js').write_text(scripts[0])
          assert 'https://gomogie-api.terajuciptabina.workers.dev' in html
          assert '/v1/feed?limit=30' in html
          assert 'avatarUrl,coverUrl})' in html, 'Profile save must send both persisted media URLs'
          assert 'const media=await uploadImage(profileDraft.coverFile,"cover")' in html, 'Cover upload response must be consumed'
          assert 'const media=await uploadImage(profileDraft.avatarFile,"avatar")' in html, 'Avatar upload response must be consumed'
          assert 'profileDraft.avatarUrl=URL.createObjectURL(file);const preview=document.querySelector(".profile-avatar")' in html, 'Avatar preview must update without rebuilding the form'
          assert 'profileDraft.coverUrl=URL.createObjectURL(file);const preview=document.querySelector(".profile-cover")' in html, 'Cover preview must update without rebuilding the form'
          assert 'accounts.filter(a=>!a.isSynthetic).slice(0,6)' in html, 'Stories must use live members only'
          assert 'const results=document.getElementById("discoverResults")' in html and 'results.onclick=async event=>' in html, 'Discover actions must use delegation for asynchronously rendered member cards'
          assert 'preload="none"' in html, 'Feed videos must not preload media before playback'
          assert 'data-feed-video muted loop playsinline preload="none"' in html, 'Feed videos must defer network loading until playback'
          assert '.post-gallery{position:relative;overflow:hidden;border-radius:14px;background:#fff;touch-action:pan-x pan-y}' in html, 'Post galleries must allow native horizontal swipe and vertical page scrolling'
          assert 'decoding="async"' in html, 'Feed images must decode asynchronously'
          assert 'function cacheHomeView()' in html and 'function restoreHomeView()' in html, 'Home view DOM must persist across tab navigation'
          assert 'lastRenderedPage!=="home"' in html and 'restoredHome=restoreHomeView()' in html, 'Returning to Home must restore existing media elements instead of rebuilding them'
          assert 'new Map(liveItems.map(item=>item.author).filter(author=>author&&author.id).map(author=>[author.id,' in html, 'Live feed account mapping must deduplicate repeated post authors'
          assert 'function renderFeedPostSafely(post)' in html and '.map(renderFeedPostSafely)' in html, 'One post rendering failure must not abort the entire Home feed'
          assert 'function showFeedRenderFailure(error)' in html and 'data-feed-retry' in html, 'Home feed rendering failures must show a recoverable error state'
          assert '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' in html, 'Mobile viewport must preserve user zoom and safe-area support'
          assert 'assets/brand/brand-tokens.css' in html, 'Shared brand design tokens must be loaded'
          assert html.count('GomoGie UI system v2') == 1, 'Use one consolidated responsive UI system'
          assert 'community-card-mark' in html and 'music-art-placeholder' in html, 'Community and music fallback identity must exist'
          assert 'user-scalable=no' not in html and 'maximum-scale=1' not in html, 'Do not disable user zoom'
          assert 'gesturestart",e=>e.preventDefault()' not in html, 'Do not block iOS pinch gestures'
          assert 'async function openThread(postId)' in html, 'Threaded conversation UI missing'
          assert 'body:JSON.stringify({content,parentId})' in html, 'Nested replies must send the selected parent comment ID'
          assert 'data-thread-edit=' in html and 'data-thread-delete=' in html, 'Own replies must expose edit and delete controls'
          assert 'maxlength="20000"' in html and 'id="composerText" rows="3"' in html, 'Long-form composer must support multiline posts up to 20,000 characters'
          assert 'async e=>{' in html and 'method:"PATCH"' in html and 'method:"DELETE"' in html, 'Reply edit and delete actions must be wired'
          api = Path('workers/api/src/index.js').read_text()
          assert 'input.content.length > 20000' in api, 'API must accept long-form posts'
          assert 'if (commentMatch && method === "PATCH")' in api and 'if (commentMatch && method === "DELETE")' in api, 'API must expose reply edit and delete routes'
          assert "status='deleted'" in api and 'c.status IN (\'published\',\'deleted\')' in api, 'Deleted replies must preserve nested conversation context'
          assert 'data-quote="' in html and '[[quote:' in html, 'Quote repost UI and source marker missing'
          assert 'data-topic="' in html and 'Trending topics' not in html, 'Topic discovery controls missing'
          print('Extracted application script and verified Cloudflare feed integration.')
          PY
          node -e 'const fs = require("node:fs"); const vm = require("node:vm"); new vm.Script(fs.readFileSync("/tmp/gomogie-inline.js", "utf8"), { filename: "gomogie-inline.js" }); console.log("Validated browser classic-script syntax.");'
      - name: Validate PWA manifest and icons
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          manifest = json.loads(Path('manifest.webmanifest').read_text())
          assert manifest['display'] == 'standalone'
          assert manifest['scope'] == './'
          assert manifest['start_url'].startswith('./')
          html = Path('index.html').read_text()
          worker = Path('sw.js').read_text()
          assert 'apple-touch-icon' in html
          assert 'navigator.serviceWorker.register("./sw.js"' in html
          assert 'updateViaCache:"none"' in html, 'Service worker script must bypass intermediary HTTP cache'
          assert 'appRegistration.update()' in html and 'visibilitychange' in html, 'App must check for updates when opened and resumed'
          expected = {
              'assets/brand/apple-touch-icon.png': 180,
              'assets/brand/icon-192.png': 192,
              'assets/brand/icon-512.png': 512,
          }
          for icon, size in expected.items():
              data = Path(icon).read_bytes()
              assert data[:8].hex() == '89504e470d0a1a0a'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (size, size)
          assert any(i['src'] == 'assets/brand/icon-192.png' for i in manifest['icons'])
          assert any(i['src'] == 'assets/brand/icon-512.png' for i in manifest['icons'])
          assert 'cache.put(request' in worker
          assert 'https://gomogie-api.terajuciptabina.workers.dev' in worker and 'request.destination==="image"' in worker, 'Uploaded GomoGie images must persist in the service-worker cache'
          assert 'const CACHE_NAME=CACHE_PREFIX+"v50"' in worker, 'Service worker cache must be versioned for the media cache change'
          assert 'new URL(event.notification.data?.url||"./",self.registration.scope)' in worker, 'Notification click must remain inside the GomoGie Pages project path.'
          print('Validated PWA registration, manifest and iOS/Android icons.')
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp a unique service-worker build revision
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('sw.js')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('const CACHE_NAME=CACHE_PREFIX+')]
          assert len(matches) == 1, f'Expected one cache revision declaration, found {len(matches)}'
          revision = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          lines[matches[0]] = 'const CACHE_NAME=CACHE_PREFIX+"build-' + revision + '";'
          path.write_text('\n'.join(lines) + '\n')
          print('Stamped service worker build revision: ' + revision)
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Wait for Pages artifact indexing
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: github-pages-${{ github.run_attempt }}
