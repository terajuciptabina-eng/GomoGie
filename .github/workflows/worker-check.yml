name: Cloudflare Worker checks

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run
