name: Validate and deploy GomoGie Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gomogie-worker-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and VAPID generator syntax
        run: |
          node --check workers/api/src/index.js
          node --check workers/api/scripts/generate-vapid.mjs
          node --check workers/api/scripts/configure-vapid.mjs
      - name: Validate push implementation and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          worker = Path("workers/api/src/index.js").read_text()
          helper = Path("workers/api/scripts/generate-vapid.mjs").read_text()
          config = Path("workers/api/wrangler.toml").read_text()
          migrations = list(Path("workers/api").rglob("*.sql"))
          push_migrations = [p for p in migrations if "push" in p.name.lower() or "push" in p.read_text().lower()]
          assert "async function sendWebPush" in worker
          assert "async function notifyPushDevices" in worker
          assert "VAPID_PUBLIC_KEY" in worker and "VAPID_PRIVATE_JWK" in worker and "VAPID_SUBJECT" in worker
          assert 'path==="/v1/push/public-key"' in worker
          assert 'path==="/v1/push/subscribe"' in worker
          assert "mailto:terajuciptabina@gmail.com" in helper
          assert "database_name = \"gomogie-db\"" in config
          assert push_migrations, "No D1 migration defining the web-push subscription table was found."
          assert "gomogie_push_subscriptions" in "\n".join(p.read_text() for p in push_migrations)
          print("Validated Worker push sender, VAPID generator, D1 migration and deployment configuration.")
          PY
      - name: Validate OAuth routes, identity schema and registration guard
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("workers/api/src/index.js").read_text()
          migration = Path("workers/api/sql/0028_oauth_identity.sql").read_text()
          frontend = Path("index.html").read_text()
          config = Path("workers/api/wrangler.toml").read_text()
          operations = Path("workers/api/README.md").read_text()
          assert 'OAUTH_FRONTEND_URL = "https://terajuciptabina-eng.github.io/GomoGie/"' in config, "OAuth must return to the GomoGie Pages project URL."
          assert "https://gomogie-api.terajuciptabina.workers.dev/v1/auth/oauth/google/callback" in operations
          assert "https://gomogie-api.terajuciptabina.workers.dev/v1/auth/oauth/facebook/callback" in operations
          for marker in ["verifyGoogleIdToken", "code_challenge_method", "oauth_state_invalid", "gomogie_oauth_identities", "/v1/auth/oauth/exchange", "env.ALLOW_REGISTRATION !== \"true\"", "DELETE FROM gomogie_oauth_states WHERE state_hash=? RETURNING", "DELETE FROM gomogie_oauth_handoffs WHERE code_hash=? RETURNING"]:
              assert marker in worker, f"OAuth security or route marker missing: {marker}"
          assert "SELECT provider,code_verifier,nonce,expires_at FROM gomogie_oauth_states WHERE state_hash=?" not in worker, "OAuth state must be atomically consumed."
          assert "SELECT user_id,expires_at FROM gomogie_oauth_handoffs WHERE code_hash=?" not in worker, "OAuth handoff must be atomically consumed."
          for table in ["gomogie_oauth_identities", "gomogie_oauth_states", "gomogie_oauth_handoffs"]:
              assert f"CREATE TABLE IF NOT EXISTS {table}" in migration, f"OAuth migration missing {table}"
          assert "id=\"googleSignIn\"" in frontend and "id=\"facebookSignIn\"" in frontend
          assert "handleOAuthReturn().then(()=>loadGomoGieData())" in frontend
          print("Validated Google/Facebook OAuth routes, state/PKCE, one-time handoff and frontend callback.")
          PY
      - name: Validate friend and message request implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path('workers/api/src/index.js').read_text()
          migration = Path('workers/api/sql/0019_relationships_and_message_requests.sql').read_text()
          page = Path('index.html').read_text()
          for route in ['/v1/friends','/v1/friend-requests','/v1/message-requests','/friend-request']:
              assert route in worker, f'Missing relationship route: {route}'
          assert 'gomogie_message_requests' in worker and 'friend_requests' in worker
          assert 'CREATE TABLE IF NOT EXISTS friend_requests' in migration
          assert 'CREATE TABLE IF NOT EXISTS gomogie_message_requests' in migration
          assert 'data-connect-tab="friends"' in page and 'data-connect-tab="requests"' in page and 'data-connect-tab="messages"' in page
          assert 'settings-feature-detail' not in page and 'settings-feature-summary' not in page
          print('Validated friendship, follow separation, message requests and Connect UI.')
          PY
      - name: Validate Pages notification-click scope fix
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("sw.js").read_text()
          assert 'new URL(event.notification.data?.url||"./",self.registration.scope).href' in worker
          print("Validated notification navigation remains inside the GomoGie Pages scope.")
          PY

      - name: Validate Watch video discovery ingestion and diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("workers/api/src/index.js").read_text()
          migration = Path("workers/api/sql/0024_video_discovery_sources.sql").read_text()
          diagnostics = Path("workers/api/sql/0025_news_source_run_diagnostics.sql").read_text()
          config = Path("workers/api/wrangler.toml").read_text()
          required = ["mlstudios-video", "aphd-video", "siakapkeli-video", "astroawani-video", "buletintv3-video", "kinitv-video", "thestar-video", "fmt-video"]
          for source in required:
              assert f'id:"{source}"' in worker, f"Worker source missing: {source}"
          for source in required:
              assert source in migration, f"D1 activation migration missing: {source}"
          assert "staleVideoSource" in worker, "Video mode must inspect every active video source"
          assert "feedItemCount" in worker and "acceptedCount" in worker and "upsertChanges" in worker
          assert "gomogie_news_source_runs" in worker and "gomogie_news_source_runs" in diagnostics
          assert 'crons = ["*/15 * * * *"]' in config
          print("Validated 8 video sources, active-source refresh, per-source diagnostics and 15-minute Cron.")
          PY

      - name: Validate contextual social notifications and privacy
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("workers/api/src/index.js").read_text()
          page = Path("index.html").read_text()
          sw = Path("sw.js").read_text()
          for event in ["new_post", "reaction", "comment", "mention", "follow", "friend_request", "friend_accepted", "message", "message_request", "message_request_accepted"]:
              assert event in worker, f"Missing notification event: {event}"
          for field in ["AS post_id", "AS post_preview", "AS comment_preview", "AS message_preview", "AS reaction_type"]:
              assert field in worker, f"Missing notification context: {field}"
          assert "notification.actorId" in worker, "Push alerts must identify the actor."
          assert "notificationDeepLink(notification)" in worker, "Push alerts must open the related destination."
          assert "postAudienceIds.has(recipient.id)" in worker, "Mention alerts must respect post visibility."
          assert '"comment", id, now' in worker, "Comment alerts must reference the exact comment."
          assert "function handleNotificationDeepLink()" in page
          assert "notificationAction(n.type,n)" in page
          assert "n.messagePreview||n.commentPreview||n.postPreview" in page
          assert "self.registration.showNotification" in sw and "notificationclick" in sw
          print("Validated actor-aware push, contextual in-app alerts, deep links and visibility-aware post notifications.")
          PY

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository/environment secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret."; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Apply only the additive Web Push schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0018_web_push.sql
      - name: Apply additive relationship and message request schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0019_relationships_and_message_requests.sql
      - name: Apply ordered mixed-media post gallery schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0020_post_media_gallery.sql
      - name: Apply private message attachments schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0021_message_attachments.sql
      - name: Add message image context to media assets when missing
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HAS_MEDIA_CONTEXT=$(wrangler d1 execute gomogie-db --remote --command="SELECT COUNT(*) AS has_column FROM pragma_table_info('gomogie_media_assets') WHERE name='media_context';" --json | node -e '
            let input="";
            process.stdin.on("data",chunk=>input+=chunk);
            process.stdin.on("end",()=>{
              const result=JSON.parse(input);
              const row=(Array.isArray(result)?result:[]).flatMap(item=>item.results||[]).find(item=>item.has_column!==undefined);
              if(!row) process.exit(2);
              process.stdout.write(String(row.has_column));
            });
          ')
          if [ "$HAS_MEDIA_CONTEXT" = "0" ]; then
            wrangler d1 execute gomogie-db --remote --file=sql/0022_message_image_context.sql
          else
            echo "media_context already exists; skipping additive schema step."
          fi
      - name: Ensure APHD Channel is an active Content Discovery source
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0023_aphd_content_discovery.sql
      - name: Activate expanded Watch video discovery sources
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0024_video_discovery_sources.sql
      - name: Create per-source news ingestion diagnostics table
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0025_news_source_run_diagnostics.sql
      - name: Apply post music schema before serving feed requests
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0027_post_music.sql
      - name: Apply additive OAuth identity and handoff schema
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute gomogie-db --remote --file=sql/0028_oauth_identity.sql
      - name: Deploy Worker before checking existing Push keys
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
      - name: Generate VAPID keys once and configure Worker secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/configure-vapid.mjs
      - name: Deploy Worker with Push configuration
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
