<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10202d"><meta name="description" content="GomoGie — Connect. Share. Discover.">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<title>GomoGie — Connect. Share. Discover.</title>
<style>
:root{--navy:#10202d;--teal:#00ae9c;--ink:#17232d;--muted:#71808c;--line:#e8edf0;--bg:#f5f7f8;--white:#fff;--shadow:0 8px 28px #10202d0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 max(20px,calc((100vw - 1440px)/2));position:sticky;top:0;z-index:10}.logo{width:150px;height:auto}.search{flex:1;max-width:560px;background:#f1f4f5;border:1px solid transparent;border-radius:30px;padding:11px 18px;outline:none}.search:focus{border-color:var(--teal)}.topright{margin-left:auto;display:flex;align-items:center;gap:14px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#dfe7e8}.layout{max-width:1440px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:220px minmax(0,680px) 280px;gap:24px}.side,.right{position:sticky;top:92px;height:max-content}.nav{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:#52616b;display:flex;gap:12px;align-items:center;font-weight:600}.nav button.active,.nav button:hover{background:#e7f7f4;color:#008f80}.nav .ico{width:22px;text-align:center;font-size:18px}.side-note{font-size:12px;color:var(--muted);padding:14px 8px}.main{min-width:0}.stories{display:flex;gap:14px;overflow:auto;background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}.story{flex:0 0 66px;text-align:center;font-size:11px;color:#596772;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.story img{width:56px;height:56px;border-radius:50%;object-fit:cover;padding:3px;border:2px solid var(--teal);margin-bottom:5px}.composer,.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px}.composer{padding:16px}.composer-row{display:flex;gap:12px;align-items:center}.composer input{border:0;background:#f5f7f8;border-radius:24px;padding:12px 16px;flex:1;min-width:0}.compose-actions{display:flex;gap:8px;margin:12px 0 0 48px;flex-wrap:wrap}.soft{border:0;background:#f2f6f6;color:#46565e;padding:8px 12px;border-radius:20px}.card{overflow:hidden}.post-head{padding:15px 16px;display:flex;align-items:center;gap:10px}.post-head .meta{flex:1}.name{font-weight:700}.handle{font-size:12px;color:var(--muted)}.post-text{padding:0 16px 12px}.post-media{display:block;width:100%;max-height:540px;object-fit:cover;background:#e7edef}.post-actions{display:flex;gap:18px;padding:12px 16px;color:#63727c}.post-actions button{border:0;background:none;color:inherit;padding:0}.post-actions button.liked{color:#e34d6f}.post-footer{font-size:12px;color:var(--muted);padding:0 16px 14px}.panel{padding:16px}.panel h3{margin:0 0 12px;font-size:15px}.trend{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.trend:last-child{border:0}.people{display:flex;align-items:center;gap:9px;padding:9px 0}.people .meta{flex:1;min-width:0}.follow{border:1px solid #b9e8e1;background:white;color:#008f80;border-radius:18px;padding:6px 11px;font-size:12px}.section-title{font-size:20px;margin:8px 0 14px}.watch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.video-card{border-radius:16px;overflow:hidden;background:white;border:1px solid var(--line)}.video-thumb{width:100%;aspect-ratio:9/14;object-fit:cover;background:#dce7e7}.video-info{padding:10px;font-size:13px}.directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.person-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.person-card img{width:62px;height:62px;border-radius:50%;object-fit:cover}.person-card strong{display:block;font-size:13px;margin-top:7px}.person-card small{color:var(--muted)}.empty{padding:36px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px}.badge{font-size:10px;letter-spacing:.04em;background:#e9f7f5;color:#008b7c;border-radius:20px;padding:4px 8px;font-weight:700}.mobile-nav{display:none}
@media(max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}
@media(max-width:700px){.top{height:58px;padding:0 14px;gap:12px}.logo{width:116px}.search{max-width:none;padding:9px 12px}.topright .hide-mobile{display:none}.layout{display:block;margin:12px auto;padding:0 10px}.side{display:none}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:#64727b;font-size:10px;display:grid;gap:2px;justify-items:center}.mobile-nav button.active{color:var(--teal)}.mobile-nav span{font-size:20px}.directory{grid-template-columns:repeat(2,minmax(0,1fr))}.watch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.post-media{max-height:440px}.compose-actions{margin-left:0}.stories{padding:12px;gap:10px}.story{flex-basis:58px}.story img{width:50px;height:50px}}
</style>
</head>
<body>
<header class="top"><img class="logo" src="assets/brand/GomoGie-wordmark-transparent.svg" alt="GomoGie"><input class="search" id="search" placeholder="Search GomoGie"><div class="topright"><button class="soft hide-mobile" id="notify">♧ Notifications</button><img class="avatar" id="topAvatar" alt="Demo profile"></div></header>
<div class="layout"><aside class="side"><nav class="nav" id="sideNav"></nav><div class="side-note">Prototype preview · Synthetic demo data only</div></aside><main class="main"><div id="view"></div></main><aside class="right"><section class="panel"><h3>Trending on GomoGie</h3><div id="trends"></div></section><section class="panel"><h3>People to discover</h3><div id="suggestions"></div></section><div class="side-note">Images and videos are public stock-media references. Demo accounts are fictional.</div></aside></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<script>
const labels={home:["⌂","Home"],pulse:["⌁","Pulse"],watch:["▷","Watch"],communities:["♧","Communities"],connect:["✉","Connect"],studio:["▤","Studio"],profile:["◉","Profile"]};
let accounts=[],posts=[],active="home",watchMode="for-you",liked=new Set(),followed=new Set();
const view=document.getElementById("view");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const account=id=>accounts.find(a=>a.id===id)||accounts[0];
function nav(){const html=Object.entries(labels).map(([k,v])=>'<button data-page="'+k+'" class="'+(active===k?'active':'')+'"><span class="ico">'+v[0]+'</span>'+v[1]+'</button>').join("");document.getElementById("sideNav").innerHTML=html;document.getElementById("mobileNav").innerHTML=Object.entries(labels).slice(0,5).map(([k,v])=>'<button data-page="'+k+'" class="'+(active===k?'active':'')+'"><span>'+v[0]+'</span>'+v[1]+'</button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{active=b.dataset.page;render()})}
function stories(){return '<div class="stories">'+accounts.slice(0,12).map(a=>'<div class="story"><img src="'+a.avatarUrl+'" alt=""><div>'+esc(a.displayName.split(" ")[0])+'</div></div>').join("")+'</div>'}
function postCard(p){const a=account(p.authorId),isLiked=liked.has(p.id);let media=p.type==="video"?'<video class="post-media" controls playsinline preload="none" poster="'+p.thumbnailUrl+'" src="'+p.mediaUrl+'"></video>':p.type==="image"?'<img class="post-media" loading="lazy" src="'+p.mediaUrl+'" alt="Public stock image">':"";return '<article class="card"><div class="post-head"><img class="avatar" src="'+a.avatarUrl+'" alt=""><div class="meta"><div class="name">'+esc(a.displayName)+' <span class="badge">DEMO</span></div><div class="handle">@'+esc(a.handle)+' · synthetic account</div></div><span>•••</span></div><div class="post-text">'+esc(p.text)+' '+p.hashtags.map(h=>'#'+esc(h)).join(" ")+'</div>'+media+'<div class="post-actions"><button class="'+(isLiked?'liked':'')+'" data-like="'+p.id+'">'+(isLiked?'♥':'♡')+' '+(p.likes+(isLiked?1:0)).toLocaleString()+'</button><button data-comment="'+p.id+'">◯ '+p.comments+' comments</button><button data-share="'+p.id+'">↗ '+p.shares+' share</button><button>⌑ Save</button></div><div class="post-footer">Synthetic engagement · Media source: '+esc(p.mediaSource||"GomoGie demo")+'</div></article>'}
function composer(){return '<section class="composer"><div class="composer-row"><img class="avatar" src="'+accounts[0].avatarUrl+'"><input id="composerText" placeholder="Share something with your community…"></div><div class="compose-actions"><button class="soft">▧ Photo</button><button class="soft">▷ Video</button><button class="soft">▤ Poll</button><button class="soft" id="demoPost">Create demo post</button></div></section>'}
function feed(){view.innerHTML=stories()+composer()+posts.slice(0,30).map(postCard).join("")}
function pulse(){view.innerHTML='<h2 class="section-title">Pulse · Public conversations</h2><div class="panel"><h3>What is happening?</h3>'+["#Architecture","#TravelMY","#CoffeeCulture","#TechForGood","#WeekendProjects","#FoodDiscoveries"].map((t,i)=>'<div class="trend"><span><strong>'+t+'</strong><br><small>Trending conversation</small></span><span>'+(12.4-i*1.3)+'K posts</span></div>').join("")+'</div>'+posts.filter(p=>p.type==="text").slice(0,15).map(postCard).join("")}
function watch(){const vids=posts.filter(p=>p.type==="video"&&(watchMode==="for-you"||followed.has(p.authorId)));view.innerHTML='<h2 class="section-title">Watch</h2><div style="display:flex;gap:8px;margin-bottom:14px"><button class="soft" id="forYouTab" style="'+(watchMode==="for-you"?'background:#dff5f1;color:#008f80':'')+'">For You</button><button class="soft" id="followingTab" style="'+(watchMode==="following"?'background:#dff5f1;color:#008f80':'')+'">Following</button></div>'+(vids.length?'<div class="watch-grid">'+vids.map(p=>{const a=account(p.authorId);return '<article class="video-card"><video class="video-thumb" controls playsinline preload="none" poster="'+p.thumbnailUrl+'" src="'+p.mediaUrl+'"></video><div class="video-info"><strong>'+esc(a.displayName)+'</strong><br>'+esc(p.text)+'<br><small>'+(watchMode==="for-you"?"Recommended":"Following")+' · demo video</small></div></article>'}).join("")+'</div>':'<div class="empty">No videos from followed demo accounts yet. Follow creators in Profile to populate this feed.</div>')}
function communities(){const groups=[["Architecture & Design","42.1K members"],["Coffee Lovers","18.7K members"],["Travel Malaysia","36.4K members"],["Home Renovation","12.9K members"],["Photography Club","24.3K members"],["Tech & Startups","9.8K members"]];view.innerHTML='<h2 class="section-title">Communities</h2><div class="directory">'+groups.map((g,i)=>'<div class="person-card"><div style="font-size:32px;color:var(--teal)">'+["⌂","☕","⌖","▦","◎","⌘"][i]+'</div><strong>'+g[0]+'</strong><small>'+g[1]+'</small><p><button class="follow">Join community</button></p></div>').join("")+'</div>'}
function connect(){view.innerHTML='<h2 class="section-title">Connect</h2><section class="panel"><h3>Messages</h3>'+accounts.slice(20,34).map(a=>'<div class="people"><img class="avatar" src="'+a.avatarUrl+'"><div class="meta"><strong>'+esc(a.displayName)+'</strong><div class="handle">Synthetic demo conversation · Preview only</div></div><button class="follow">Open</button></div>').join("")+'</section>'}
function studio(){view.innerHTML='<h2 class="section-title">Studio</h2><section class="panel"><h3>Creator Studio</h3><p>Publish, manage and review your content. Creator analytics shown here are sample values only.</p><div class="directory"><div class="person-card"><strong>12.8K</strong><small>Demo views</small></div><div class="person-card"><strong>1,240</strong><small>Demo followers</small></div><div class="person-card"><strong>8.4%</strong><small>Demo engagement</small></div></div><p><span class="badge">SYNTHETIC ANALYTICS</span></p></section>'}
function profile(){view.innerHTML='<h2 class="section-title">Discover 1,000 demo accounts</h2><div class="directory">'+accounts.slice(0,120).map(a=>'<div class="person-card"><img src="'+a.avatarUrl+'" loading="lazy"><strong>'+esc(a.displayName)+'</strong><small>@'+esc(a.handle)+'</small><p><button class="follow" data-follow="'+a.id+'">'+(followed.has(a.id)?"Following":"Follow")+'</button></p><small>DEMO ACCOUNT</small></div>').join("")+'</div><p class="post-footer">Showing 120 of 1,000 synthetic accounts in this prototype.</p>'}
function bind(){const fy=document.getElementById("forYouTab"),ft=document.getElementById("followingTab");if(fy)fy.onclick=()=>{watchMode="for-you";render()};if(ft)ft.onclick=()=>{watchMode="following";render()};document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>{const id=b.dataset.like;liked.has(id)?liked.delete(id):liked.add(id);render()});document.querySelectorAll("[data-comment]").forEach(b=>b.onclick=()=>alert("Comments are simulated in this prototype."));document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>alert("Sharing is simulated in this prototype."));document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=()=>{const id=b.dataset.follow;followed.has(id)?followed.delete(id):followed.add(id);render()});const demo=document.getElementById("demoPost");if(demo)demo.onclick=()=>{const t=document.getElementById("composerText").value.trim();if(!t)return alert("Write a demo post first.");posts.unshift({id:"local_"+Date.now(),authorId:accounts[0].id,type:"text",text:t,hashtags:[],likes:0,comments:0,shares:0,isSynthetic:true,mediaSource:"Local prototype"});render()}}
function render(){nav();({home:feed,pulse,watch,communities,connect,studio,profile}[active]||feed)();bind();document.getElementById("topAvatar").src=accounts[0].avatarUrl}
function extras(){document.getElementById("trends").innerHTML=["#Architecture","#TravelMY","#Coffee","#Design","#Food"].map((t,i)=>'<div class="trend"><strong>'+t+'</strong><span>'+(8.2-i*.8)+'K</span></div>').join("");document.getElementById("suggestions").innerHTML=accounts.slice(5,9).map(a=>'<div class="people"><img class="avatar" src="'+a.avatarUrl+'"><div class="meta"><strong>'+esc(a.displayName)+'</strong><div class="handle">Suggested demo</div></div></div>').join("")}
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();if(!q)return;active="profile";render();const cards=[...document.querySelectorAll(".person-card")];cards.forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?"":"none")});
document.getElementById("notify").onclick=()=>alert("Notifications are simulated in this prototype.");
Promise.all([fetch("data/demo-accounts.json").then(r=>r.json()),fetch("data/demo-posts.json").then(r=>r.json())]).then(([a,p])=>{accounts=a.accounts;posts=p.posts;extras();render()}).catch(()=>{view.innerHTML='<div class="empty">Unable to load demo data. Open this page through GitHub Pages or a local web server.</div>'});
</script>
</body></html>
