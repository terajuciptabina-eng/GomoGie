name: D1 query-efficiency maintenance

on:
  schedule:
    - cron: "5 0 27 11 *"
  workflow_dispatch:
    inputs:
      apply_indexes:
        description: "Apply the additive D1 query-efficiency indexes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gomogie-d1-index-maintenance
  cancel-in-progress: false

jobs:
  apply-query-indexes:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply_indexes == true) || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Confirm scheduled maintenance date and Cloudflare credentials
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "2026-11-27" ]; then
            echo "Scheduled one-time maintenance date has passed; skipping."
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply additive query-efficiency indexes
        run: npx wrangler d1 execute gomogie-db --remote --file=sql/0014_query_efficiency.sql
