.watch-page{display:flex;flex-direction:column;gap:14px}.watch-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.watch-top h2{font-size:22px;margin:0}.watch-tabs{display:flex;gap:8px}.watch-tabs button{border:0;border-radius:24px;padding:10px 16px;background:#edf1f2;color:#52616b}.watch-tabs button.selected{background:#dff5f1;color:#008f80;font-weight:700}.watch-stream{height:calc(100dvh - 210px);min-height:480px;max-height:900px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;border-radius:18px;scrollbar-width:none}.watch-stream::-webkit-scrollbar{display:none}.watch-slide{position:relative;height:100%;min-height:480px;scroll-snap-align:start;scroll-snap-stop:always;background:#071016;overflow:hidden;border-radius:18px;margin-bottom:12px;isolation:isolate}.watch-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#071016}.watch-shade{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0009);pointer-events:none;z-index:1}.watch-play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border:0;border-radius:50%;background:#101820a8;color:white;font-size:25px;display:grid;place-items:center}.watch-caption{position:absolute;z-index:2;left:18px;right:84px;bottom:22px;color:white;text-shadow:0 1px 3px #0008}.watch-caption p{margin:8px 0;font-size:15px}.watch-caption small{opacity:.8}.watch-actions{position:absolute;z-index:3;right:12px;bottom:22px;display:flex;flex-direction:column;gap:16px;align-items:center}.watch-actions button{border:0;background:#111a;color:white;border-radius:24px;width:48px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:23px;gap:1px}.watch-actions small{font-size:10px}.watch-actions button:active{transform:scale(.94)}@media(max-width:700px){.watch-page{gap:10px}.watch-top{align-items:center}.watch-stream{height:calc(100dvh - 230px);min-height:420px;margin:0 -2px}.watch-slide{border-radius:16px;height:100%;min-height:420px;margin-bottom:10px}.watch-video{object-fit:cover}.watch-caption{left:14px;right:76px;bottom:18px}.watch-actions{right:8px;bottom:18px;gap:12px}.watch-actions button{width:44px;min-height:44px}}
.profile-page{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.profile-cover{height:210px;background-color:#dce8e8;background-size:cover;background-position:center;position:relative}.profile-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#10202d35)}.profile-cover .badge{position:absolute;z-index:1;right:14px;top:14px}.profile-identity{display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px;margin-top:-54px;position:relative;z-index:2}.profile-avatar{width:112px;height:112px;border:5px solid white;border-radius:50%;object-fit:cover;background:#e8eff0}.profile-actions{display:flex;gap:8px;padding-bottom:8px}.primary{border:0;border-radius:22px;background:var(--navy);color:white;padding:10px 18px;font-weight:650}.profile-info{padding:10px 22px 18px}.profile-info h2{margin:0;font-size:24px}.profile-handle{color:var(--muted);font-size:14px}.profile-info p{margin:12px 0;white-space:pre-wrap}.profile-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}.profile-stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:13px}.profile-stats strong{color:var(--ink);font-size:16px}.profile-tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.profile-tabs button{flex:1;padding:13px;border:0;background:white;color:var(--muted);font-weight:650}.profile-tabs button.selected{color:var(--teal);box-shadow:inset 0 -3px var(--teal)}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.profile-tile{border:0;background:#edf1f2;aspect-ratio:1;position:relative;padding:0;overflow:hidden}.profile-tile img{width:100%;height:100%;object-fit:cover;display:block}.tile-play{position:absolute;right:10px;top:10px;color:white;text-shadow:0 1px 5px #000;font-size:20px}.tile-text{display:grid;place-items:center;height:100%;padding:12px;font-size:13px}.profile-editor{margin:0 20px 18px;padding:16px;background:#f7f9f9;border:1px solid var(--line);border-radius:14px;display:grid;gap:10px}.profile-editor h3{margin:0}.profile-editor label{display:grid;gap:5px;font-size:13px;font-weight:650}.profile-editor input,.profile-editor textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink);width:100%}.profile-editor textarea{min-height:78px;resize:vertical}.edit-media{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile-buttons{display:flex;gap:8px}.profile-editor small{color:var(--muted)}@media(max-width:700px){.profile-cover{height:160px}.profile-identity{padding:0 14px;margin-top:-46px}.profile-avatar{width:92px;height:92px}.profile-info{padding:8px 16px 16px}.profile-info h2{font-size:21px}.profile-stats{gap:15px}.profile-grid{gap:2px}.profile-editor{margin:0 12px 14px}.edit-media{grid-template-columns:1fr}}
/* Pull-to-refresh */
.refresh-indicator{position:fixed;z-index:50;top:0;left:50%;transform:translate(-50%,-72px);display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:0 0 24px 24px;background:#fff;color:var(--navy);box-shadow:0 5px 20px #10202d18;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .16s ease;will-change:transform}
.refresh-indicator.visible{opacity:1}
.refresh-spinner{width:17px;height:17px;border:2px solid #dce9e7;border-top-color:var(--teal);border-radius:50%;display:inline-block}
.refresh-indicator.loading .refresh-spinner{animation:gomogie-spin .7s linear infinite}
@keyframes gomogie-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.refresh-spinner{animation:none!important}.refresh-indicator{transition:none}}
body.pull-dragging .top,body.pull-dragging .layout{transform:translate3d(0,var(--pull-offset,0px),0);transition:none;will-change:transform}
body.pull-releasing .top,body.pull-releasing .layout{transform:translate3d(0,0,0);transition:transform .62s cubic-bezier(.22,1.35,.36,1);will-change:transform}
@media(prefers-reduced-motion:reduce){body.pull-releasing .top,body.pull-releasing .layout{transition:transform .18s ease}}
</style>

<body>
<div class="refresh-indicator" id="refreshIndicator" role="status" aria-live="polite"><span class="refresh-spinner" aria-hidden="true"></span><span id="refreshLabel">Pull to refresh</span></div>
<div class="connection-notice" id="connectionNotice" role="status" aria-live="polite">You are offline. Showing your last loaded feed.</div><div class="preview-notice" role="note">GomoGie preview · Sample profiles and activity</div><header class="top"><img class="logo" src="assets/brand/GomoGie-wordmark-transparent.svg" alt="GomoGie"><input class="search" id="search" placeholder="Search GomoGie"><div class="topright"><button class="soft hide-mobile" id="notify">♧ Notifications</button><img class="avatar" id="topAvatar" alt="Profile photo"></div></header>
<div class="layout"><aside class="side"><nav class="nav" id="sideNav"></nav></aside><main class="main"><div id="view"></div></main><aside class="right"><section class="panel"><h3>Trending on GomoGie</h3><div id="trends"></div></section><section class="panel"><h3>People to discover</h3><div id="suggestions"></div></section></aside></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<script>
const labels={home:["⌂","Home"],pulse:["⌁","Pulse"],watch:["▷","Watch"],communities:["♧","Communities"],connect:["✉","Connect"],studio:["▤","Studio"],profile:["◉","Profile"]};
let accounts=[],posts=[],active="home",watchMode="for-you",liked=new Set(),followed=new Set(),selectedProfileId=null,profileTab="posts",editingProfile=false,profileDraft={},savedPosts=new Set(),localPendingPosts=[];
const view=document.getElementById("view");
const API_BASE="https://gomogie-api.terajucitabina.workers.dev";
async function fetchPublicApiFeed(){
 const response=await fetch(API_BASE+"/v1/feed?limit=30",{headers:{accept:"application/json"},cache:"no-store"});
 if(!response.ok)throw new Error("Public API feed unavailable ("+response.status+")");
 const payload=await response.json();
 if(!Array.isArray(payload.items))throw new Error("Invalid API feed response");
 return payload.items;
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const account=id=>accounts.find(a=>a.id===id)||accounts[0];
function nav(){const html=Object.entries(labels).map(([k,v])=>'<button data-page="'+k+'" class="'+(active===k?'active':'')+'"><span class="ico">'+v[0]+'</span>'+v[1]+'</button>').join("");document.getElementById("sideNav").innerHTML=html;document.getElementById("mobileNav").innerHTML=Object.entries(labels).filter(([k])=>k!=="studio").map(([k,v])=>'<button data-page="'+k+'" class="'+(active===k?'active':'')+'"><span>'+v[0]+'</span>'+v[1]+'</button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{active=b.dataset.page;if(active==="profile")selectedProfileId=accounts[0]?.id;editingProfile=false;render()})}
function stories(){return '<div class="stories">'+accounts.slice(0,12).map(a=>'<div class="story"><img src="'+a.avatarUrl+'" alt=""><div>'+esc(a.displayName.split(" ")[0])+'</div></div>').join("")+'</div>'}
function postCard(p){const a=account(p.authorId),isLiked=liked.has(p.id);let media=p.type==="video"?'<video class="post-media" controls playsinline preload="none" poster="'+p.thumbnailUrl+'" src="'+p.mediaUrl+'"></video>':p.type==="image"?'<img class="post-media" loading="lazy" src="'+p.mediaUrl+'" alt="Public stock image">':"";return '<article class="card"><div class="post-head" data-open-profile="'+a.id+'" style="cursor:pointer"><img class="avatar" src="'+a.avatarUrl+'" alt=""><div class="meta"><div class="name">'+esc(a.displayName)+' </div><div class="handle">@'+esc(a.handle)+'</div></div><span>•••</span></div><div class="post-text">'+esc(p.text)+' '+p.hashtags.map(h=>'#'+esc(h)).join(" ")+'</div>'+media+'<div class="post-actions"><button class="'+(isLiked?'liked':'')+'" data-like="'+p.id+'">'+(isLiked?'♥':'♡')+' '+(p.likes+(isLiked?1:0)).toLocaleString()+'</button><button data-comment="'+p.id+'">◯ '+p.comments+' comments</button><button data-share="'+p.id+'">↗ '+p.shares+' share</button><button data-save="'+p.id+'">'+(savedPosts.has(p.id)?"▣ Saved":"⌑ Save")+'</button></div><div class="post-footer">Media: '+esc(p.mediaSource||"GomoGie")+'</div></article>'}
function composer(){return '<section class="composer"><div class="composer-row"><img class="avatar" src="'+accounts[0].avatarUrl+'"><input id="composerText" placeholder="Share something with your community…"></div><div class="compose-actions"><button class="soft">▧ Photo</button><button class="soft">▷ Video</button><button class="soft">▤ Poll</button><button class="soft" id="createPost">Post</button></div></section>'}
function feed(){view.innerHTML=stories()+composer()+posts.slice(0,30).map(postCard).join("")}
function pulse(){view.innerHTML='<h2 class="section-title">Pulse · Public conversations</h2><div class="panel"><h3>What is happening?</h3>'+["#Architecture","#TravelMY","#CoffeeCulture","#TechForGood","#WeekendProjects","#FoodDiscoveries"].map((t,i)=>'<div class="trend"><span><strong>'+t+'</strong><br><small>Trending conversation</small></span><span>'+(12.4-i*1.3)+'K posts</span></div>').join("")+'</div>'+posts.filter(p=>p.type==="text").slice(0,15).map(postCard).join("")}
function watch(){
 const vids=posts.filter(p=>p.type==="video"&&(watchMode==="for-you"||followed.has(p.authorId)));
 view.innerHTML='<section class="watch-page"><div class="watch-top"><h2>Watch</h2><div class="watch-tabs"><button id="forYouTab" class="'+(watchMode==="for-you"?"selected":"")+'">For You</button><button id="followingTab" class="'+(watchMode==="following"?"selected":"")+'">Following</button></div></div>'+(vids.length?'<div class="watch-stream" id="watchStream">'+vids.map((p,i)=>{const a=account(p.authorId);return '<article class="watch-slide" data-video-id="'+p.id+'"><video class="watch-video" playsinline webkit-playsinline muted loop preload="metadata" poster="'+p.thumbnailUrl+'" src="'+p.mediaUrl+'"></video><button class="watch-play" aria-label="Play or pause video">▶</button><div class="watch-shade"></div><div class="watch-caption"><strong>'+esc(a.displayName)+' </strong><p>'+esc(p.text)+'</p><small>Media: '+esc(p.mediaSource||"GomoGie")+'</small></div><div class="watch-actions"><button data-watch-like="'+p.id+'">♡<small>'+(p.likes+(liked.has(p.id)?1:0)).toLocaleString()+'</small></button><button data-watch-comment="'+p.id+'">◯<small>'+p.comments+'</small></button><button data-watch-share="'+p.id+'">↗<small>Share</small></button><button data-watch-save="'+p.id+'">⌑<small>Save</small></button><button data-watch-follow="'+a.id+'">'+(followed.has(a.id)?"✓":"＋")+'<small>'+(followed.has(a.id)?"Following":"Follow")+'</small></button></div></article>'}).join("")+'</div>':'<div class="empty">Your Following video feed is empty. Follow creators from Profile to see their videos here.</div>')+'</section>';
 const fy=document.getElementById("forYouTab"),ft=document.getElementById("followingTab");
 if(fy)fy.onclick=()=>{watchMode="for-you";render()};
 if(ft)ft.onclick=()=>{watchMode="following";render()};
 document.querySelectorAll(".watch-slide").forEach(slide=>{
  const video=slide.querySelector("video"),play=slide.querySelector(".watch-play");
  const toggle=()=>{if(video.paused){video.play().then(()=>play.style.display="none").catch(()=>play.style.display="grid")}else{video.pause();play.style.display="grid"}};
  play.onclick=toggle;video.onclick=toggle;
  video.addEventListener("play",()=>play.style.display="none");
  video.addEventListener("pause",()=>play.style.display="grid");
 });
 const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
  const video=entry.target.querySelector("video"),play=entry.target.querySelector(".watch-play");
  if(entry.isIntersecting&&entry.intersectionRatio>=0.65){video.play().then(()=>play.style.display="none").catch(()=>play.style.display="grid")}
  else{video.pause();play.style.display="grid"}
 }),{threshold:[0,0.65,1]});
 document.querySelectorAll(".watch-slide").forEach(slide=>observer.observe(slide));
 document.querySelectorAll("[data-watch-like]").forEach(b=>b.onclick=()=>{const id=b.dataset.watchLike;liked.has(id)?liked.delete(id):liked.add(id);render()});
 document.querySelectorAll("[data-watch-follow]").forEach(b=>b.onclick=()=>{const id=b.dataset.watchFollow;followed.has(id)?followed.delete(id):followed.add(id);render()});
 document.querySelectorAll("[data-watch-comment]").forEach(b=>b.onclick=()=>alert("Comments are simulated in this prototype."));
 document.querySelectorAll("[data-watch-share]").forEach(b=>b.onclick=()=>alert("Sharing is simulated in this prototype."));
 document.querySelectorAll("[data-watch-save]").forEach(b=>b.onclick=()=>{const id=b.dataset.watchSave;savedPosts.has(id)?savedPosts.delete(id):savedPosts.add(id);render()});
}
function communities(){const groups=[["Architecture & Design","42.1K members"],["Coffee Lovers","18.7K members"],["Travel Malaysia","36.4K members"],["Home Renovation","12.9K members"],["Photography Club","24.3K members"],["Tech & Startups","9.8K members"]];view.innerHTML='<h2 class="section-title">Communities</h2><div class="directory">'+groups.map((g,i)=>'<div class="person-card"><div style="font-size:32px;color:var(--teal)">'+["⌂","☕","⌖","▦","◎","⌘"][i]+'</div><strong>'+g[0]+'</strong><small>'+g[1]+'</small><p><button class="follow">Join community</button></p></div>').join("")+'</div>'}
function connect(){view.innerHTML='<h2 class="section-title">Connect</h2><section class="panel"><h3>Messages</h3>'+accounts.slice(20,34).map(a=>'<div class="people"><img class="avatar" src="'+a.avatarUrl+'"><div class="meta"><strong>'+esc(a.displayName)+'</strong><div class="handle">Conversation preview · Not connected</div></div><button class="follow">Open</button></div>').join("")+'</section>'}

function profile(){
 if(!selectedProfileId){discoverProfiles();return}
 const a=accounts.find(x=>x.id===selectedProfileId)||accounts[0];if(!a){view.innerHTML='<div class="empty">No profile selected.</div>';return}
 const mine=a.id===accounts[0].id,ownPosts=posts.filter(p=>p.authorId===a.id),shown=profileTab==="reels"?ownPosts.filter(p=>p.type==="video"):profileTab==="saved"?ownPosts.filter(p=>savedPosts.has(p.id)):ownPosts;
 const avatar=profileDraft.avatarUrl||a.avatarUrl,cover=profileDraft.coverUrl||a.coverUrl||"";
 const editor=editingProfile&&mine?'<form class="profile-editor" id="profileEditor"><h3>Edit profile</h3><label>Display name<input name="displayName" value="'+esc(a.displayName)+'" maxlength="60"></label><label>Bio<textarea name="bio" maxlength="160">'+esc(a.bio||"")+'</textarea></label><label>Location<input name="location" value="'+esc(a.location||"")+'" maxlength="80"></label><label>Website<input name="website" value="'+esc(a.website||"")+'" maxlength="120" placeholder="https://example.com"></label><div class="edit-media"><label>Profile photo<input type="file" id="avatarUpload" accept="image/*"></label><label>Cover photo<input type="file" id="coverUpload" accept="image/*"></label></div><div class="profile-buttons"><button type="submit" class="primary">Save changes</button><button type="button" class="soft" id="cancelEdit">Cancel</button></div><small>Changes are temporary in this browser prototype. No files are uploaded to a server.</small></form>':"";
 view.innerHTML='<section class="profile-page"><div class="profile-cover" style="background-image:url(\''+cover+'\')"></div><div class="profile-identity"><img class="profile-avatar" src="'+avatar+'" alt=""><div class="profile-actions">'+(mine?'<button class="primary" id="editProfile">Edit profile</button>':'<button class="follow" data-follow="'+a.id+'">'+(followed.has(a.id)?"Following":"Follow")+'</button>')+'<button class="soft" id="profileMore">•••</button></div></div><div class="profile-info"><h2>'+esc(a.displayName)+'</h2><div class="profile-handle">@'+esc(a.handle)+'</div><p>'+esc(a.bio||"Welcome to my GomoGie profile.")+'</p><div class="profile-meta">'+(a.location?'<span>⌖ '+esc(a.location)+'</span>':"")+(a.website?'<span>↗ '+esc(a.website)+'</span>':"")+'<span>◷ Joined '+esc(a.joined||"2026")+'</span></div><div class="profile-stats"><span><strong>'+ownPosts.length+'</strong> posts</span><span><strong>'+Number(a.followers||0)+(followed.has(a.id)?1:0)+'</strong> followers</span><span><strong>'+Number(a.following||0)+'</strong> following</span></div></div>'+editor+'<div class="profile-tabs"><button data-profile-tab="posts" class="'+(profileTab==="posts"?"selected":"")+'">Posts</button><button data-profile-tab="reels" class="'+(profileTab==="reels"?"selected":"")+'">Videos</button><button data-profile-tab="saved" class="'+(profileTab==="saved"?"selected":"")+'">Saved</button></div>'+(shown.length?'<div class="profile-grid">'+shown.map(p=>'<button class="profile-tile" data-post-open="'+p.id+'">'+(p.type==="video"?'<img src="'+(p.thumbnailUrl||"")+'" alt=""><span class="tile-play">▶</span>':p.type==="image"?'<img src="'+p.mediaUrl+'" alt="">':'<span class="tile-text">'+esc(p.text)+'</span>')+'</button>').join("")+'</div>':'<div class="empty">No '+(profileTab==="reels"?"videos":profileTab==="saved"?"saved posts":"posts")+' yet.</div>')+'</section>';
}
function bind(){
 document.querySelectorAll("[data-open-profile]").forEach(b=>b.onclick=()=>{active="profile";selectedProfileId=b.dataset.openProfile;profileTab="posts";editingProfile=false;render()});
 document.querySelectorAll("[data-profile-tab]").forEach(b=>b.onclick=()=>{profileTab=b.dataset.profileTab;render()});
 const edit=document.getElementById("editProfile");if(edit)edit.onclick=()=>{editingProfile=true;profileDraft={};render()};
 const cancel=document.getElementById("cancelEdit");if(cancel)cancel.onclick=()=>{editingProfile=false;profileDraft={};render()};
 const form=document.getElementById("profileEditor");if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),me=accounts[0];me.displayName=String(fd.get("displayName")||me.displayName).trim();me.bio=String(fd.get("bio")||"").trim();me.location=String(fd.get("location")||"").trim();me.website=String(fd.get("website")||"").trim();if(profileDraft.avatarUrl)me.avatarUrl=profileDraft.avatarUrl;if(profileDraft.coverUrl)me.coverUrl=profileDraft.coverUrl;editingProfile=false;profileDraft={};render()};
 const avatarInput=document.getElementById("avatarUpload");if(avatarInput)avatarInput.onchange=e=>{const file=e.target.files[0];if(file){profileDraft.avatarUrl=URL.createObjectURL(file);render();editingProfile=true}};
 const coverInput=document.getElementById("coverUpload");if(coverInput)coverInput.onchange=e=>{const file=e.target.files[0];if(file){profileDraft.coverUrl=URL.createObjectURL(file);render();editingProfile=true}};
 const more=document.getElementById("profileMore");if(more)more.onclick=()=>alert("Profile actions are available in the preview only.");
 const fy=document.getElementById("forYouTab"),ft=document.getElementById("followingTab");if(fy)fy.onclick=()=>{watchMode="for-you";render()};if(ft)ft.onclick=()=>{watchMode="following";render()};document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>{const id=b.dataset.like;liked.has(id)?liked.delete(id):liked.add(id);render()});document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const id=b.dataset.save;savedPosts.has(id)?savedPosts.delete(id):savedPosts.add(id);render()});document.querySelectorAll("[data-comment]").forEach(b=>b.onclick=()=>alert("Comments are simulated in this prototype."));document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>alert("Sharing is simulated in this prototype."));document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=()=>{const id=b.dataset.follow;followed.has(id)?followed.delete(id):followed.add(id);render()});const demo=document.getElementById("createPost");if(demo)demo.onclick=()=>{const t=document.getElementById("composerText").value.trim();if(!t)return alert("Write a post first.");const item={id:"local_"+Date.now(),authorId:accounts[0].id,type:"text",text:t,hashtags:[],likes:0,comments:0,shares:0,isSynthetic:true,mediaSource:"Saved on this device",pendingLocal:true};posts.unshift(item);localPendingPosts.unshift(item);saveLocalPendingPosts();document.getElementById("composerText").value="";render();alert("This prototype saves posts on this device only. Publishing to other people requires the production server.")}}
function render(){nav();({home:feed,pulse,watch,communities,connect,studio,profile}[active]||feed)();bind();document.getElementById("topAvatar").src=accounts[0].avatarUrl;document.getElementById("topAvatar").onclick=()=>{active="profile";selectedProfileId=accounts[0].id;editingProfile=false;render()}}
function extras(){document.getElementById("trends").innerHTML=["#Architecture","#TravelMY","#Coffee","#Design","#Food"].map((t,i)=>'<div class="trend"><strong>'+t+'</strong><span>'+(8.2-i*.8)+'K</span></div>').join("");document.getElementById("suggestions").innerHTML=accounts.slice(5,9).map(a=>'<div class="people"><img class="avatar" src="'+a.avatarUrl+'"><div class="meta"><strong>'+esc(a.displayName)+'</strong><div class="handle">Suggested for you</div></div></div>').join("")}
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();if(!q)return;active="profile";selectedProfileId=null;render();const cards=[...document.querySelectorAll(".person-card")];cards.forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?"":"none")});
document.getElementById("notify").onclick=()=>alert("Notifications are simulated in this prototype.");
const refreshIndicator=document.getElementById("refreshIndicator"),refreshLabel=document.getElementById("refreshLabel");
let refreshStartY=0,pullDistance=0,pullArmed=false,isRefreshing=false,releaseTimer=null;
function setPullOffset(px){document.body.style.setProperty("--pull-offset",px+"px")}
function paintPull(distance){
 const rubber=distance<=120?distance*.58:69.6+(distance-120)*.22;
 const shown=Math.min(rubber,105);
 setPullOffset(shown);
 refreshIndicator.style.transform="translate(-50%,"+Math.max(-72,shown-72)+"px)";
 refreshIndicator.classList.toggle("visible",distance>7);
 refreshLabel.textContent=distance>=88?"Release to refresh":"Pull to refresh";
}
function springBack(){
 document.body.classList.remove("pull-dragging");
 document.body.classList.add("pull-releasing");
 setPullOffset(0);
 refreshIndicator.classList.remove("visible");
 refreshIndicator.style.transform="translate(-50%,-72px)";
 clearTimeout(releaseTimer);
 releaseTimer=setTimeout(()=>document.body.classList.remove("pull-releasing"),680);
}
const DB_NAME="gomogie-device-cache",DB_VERSION=1;
function openLocalDB(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains("cache"))request.result.createObjectStore("cache")};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function localGet(key){const db=await openLocalDB();return new Promise((resolve,reject)=>{const tx=db.transaction("cache","readonly"),r=tx.objectStore("cache").get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function localSet(key,value){const db=await openLocalDB();return new Promise((resolve,reject)=>{const tx=db.transaction("cache","readwrite");tx.objectStore("cache").put(value,key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function saveLocalPendingPosts(){try{await localSet("pending-posts",localPendingPosts)}catch(e){console.warn("Pending post cache unavailable",e)}}
function updateConnectionState(){const n=document.getElementById("connectionNotice");if(n){n.classList.toggle("visible",!navigator.onLine);n.textContent="You are offline. Showing your last loaded feed; publishing and messaging are unavailable."}}
window.addEventListener("online",updateConnectionState);window.addEventListener("offline",updateConnectionState);
async function loadGomoGieData(){
 const stamp=Date.now();let a,p;
 try{
  const results=await Promise.all([
   fetch("data/demo-accounts.json?refresh="+stamp,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Accounts unavailable");return r.json()}),
   fetch("data/demo-posts.json?refresh="+stamp,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Posts unavailable");return r.json()})
  ]);
  a=results[0];p=results[1];
  if(!Array.isArray(a.accounts)||!Array.isArray(p.posts))throw new Error("Invalid GomoGie data");
  accounts=a.accounts;posts=p.posts;
  try{
   const liveItems=await fetchPublicApiFeed();
   if(liveItems.length){
    const liveAccounts=liveItems.map(item=>item.author).filter(Boolean).map(author=>({
     id:author.id,handle:author.username,displayName:author.displayName||author.username,
     avatarUrl:author.avatarUrl||"",coverUrl:"",bio:"",location:"",website:"",
     joined:"GomoGie",followers:0,following:0
    }));
    const accountIds=new Set(accounts.map(item=>item.id));
    accounts=[...accounts,...liveAccounts.filter(item=>!accountIds.has(item.id))];
    posts=liveItems.map(item=>({
     id:item.id,authorId:item.author?.id,type:"text",text:item.content||"",hashtags:[],
     likes:Number(item.reactionCount||0),comments:Number(item.commentCount||0),shares:0,
     mediaSource:"GomoGie live API",createdAt:item.createdAt
    }));
    const notice=document.querySelector(".preview-notice");
    if(notice)notice.textContent="GomoGie · Live public community feed";
   }else{
    const notice=document.querySelector(".preview-notice");
    if(notice)notice.textContent="GomoGie preview · Sample activity (live feed is empty)";
   }
  }catch(apiError){
   console.warn("Live API feed unavailable; using preview data:",apiError);
   const notice=document.querySelector(".preview-notice");
   if(notice)notice.textContent="GomoGie preview · Sample activity (API temporarily unavailable)";
  }
  try{await localSet("last-feed",{accounts,posts,savedAt:Date.now()})}catch(e){console.warn("Feed cache unavailable",e)}
 }catch(error){
  const cached=await localGet("last-feed");
  if(!cached||!Array.isArray(cached.accounts)||!Array.isArray(cached.posts))throw error;
  accounts=cached.accounts;posts=cached.posts;
 }
 try{localPendingPosts=await localGet("pending-posts")||[]}catch(e){localPendingPosts=[]}
 const ids=new Set(posts.map(x=>x.id));posts=[...localPendingPosts.filter(x=>!ids.has(x.id)),...posts];
 extras();render();updateConnectionState();
}
async function refreshGomoGie(){
 if(isRefreshing)return;
 isRefreshing=true;pullArmed=false;pullDistance=0;
 document.body.classList.remove("pull-dragging","pull-releasing");
 setPullOffset(0);
 refreshIndicator.classList.add("visible","loading");
 refreshLabel.textContent="Refreshing GomoGie…";
 refreshIndicator.style.transform="translate(-50%,0px)";
 try{
  await loadGomoGieData();
  refreshLabel.textContent="GomoGie updated";
 }catch(error){
  refreshLabel.textContent="Refresh failed. Pull down to try again.";
  console.error("GomoGie refresh failed:",error);
 }finally{
  refreshIndicator.classList.remove("loading");
  setTimeout(()=>{refreshIndicator.classList.remove("visible");refreshIndicator.style.transform="translate(-50%,-72px)";isRefreshing=false},900);
 }
}
document.addEventListener("touchstart",e=>{
 if(isRefreshing||window.scrollY>0||!e.touches||e.touches.length!==1)return;
 if(e.target.closest("input,textarea,select,[contenteditable=true]"))return;
 refreshStartY=e.touches[0].clientY;pullDistance=0;pullArmed=true;
 document.body.classList.remove("pull-releasing");
 document.body.classList.add("pull-dragging");
},{passive:true});
document.addEventListener("touchmove",e=>{
 if(!pullArmed||isRefreshing||!e.touches||e.touches.length!==1)return;
 const delta=e.touches[0].clientY-refreshStartY;
 if(delta<=0){pullDistance=0;setPullOffset(0);refreshIndicator.classList.remove("visible");return}
 if(window.scrollY<=0){
  pullDistance=delta;
  if(delta>4)e.preventDefault();
  paintPull(delta);
 }
},{passive:false});
document.addEventListener("touchend",()=>{
 if(!pullArmed)return;
 const shouldRefresh=pullDistance>=88;
 pullArmed=false;
 if(shouldRefresh)refreshGomoGie();
 else springBack();
},{passive:true});
document.addEventListener("touchcancel",()=>{if(!pullArmed)return;pullArmed=false;pullDistance=0;springBack()},{passive:true});
// PWA update lifecycle: check for a new deployment whenever the installed app opens or returns to the foreground.
if("serviceWorker" in navigator){
 const hadController=!!navigator.serviceWorker.controller;
 let reloadingForUpdate=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{
  if(hadController&&!reloadingForUpdate){
   reloadingForUpdate=true;
   window.location.reload();
  }
 });
 window.addEventListener("load",async()=>{
  try{
   const registration=await navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"});
   await registration.update();
   document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible")registration.update().catch(()=>{});
   });
   window.addEventListener("focus",()=>registration.update().catch(()=>{}));
  }catch(error){console.warn("GomoGie update check unavailable:",error)}
 });
}
updateConnectionState();
loadGomoGieData().catch(()=>{view.innerHTML='<div class="empty">Unable to load GomoGie content. Please check your connection and refresh.</div>'});
</script>
